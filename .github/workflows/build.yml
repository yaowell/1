name: Build 1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make git perl

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $GITHUB_WORKSPACE/theos

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/iPhoneOS16.5.sdk $GITHUB_WORKSPACE/theos/sdks/

      - name: Install ldid
        run: |
          curl -L https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64.tar.gz -o /tmp/ldid.tar.gz
          tar -xzf /tmp/ldid.tar.gz -C /tmp
          sudo cp /tmp/ldid /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Build rootless package
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload rootless deb
        uses: actions/upload-artifact@v4
        with:
          name: 1-rootless-deb
          path: packages/*.deb