name: Build 1

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid

      - name: Clone Roothide Theos and SDKs
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Roothide Package
        run: |
          make clean package \
            THEOS_PACKAGE_SCHEME=roothide \
            SYSROOT=$HOME/theos/sdks/iPhoneOS16.5.sdk \
            FINALPACKAGE=1

      - name: Build Rootless Package
        run: |
          make clean package \
            THEOS_PACKAGE_SCHEME=rootless \
            SYSROOT=$HOME/theos/sdks/iPhoneOS16.5.sdk \
            FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1-1.0-Debs
          path: packages/*.deb